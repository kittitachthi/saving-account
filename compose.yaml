services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saving_account
      POSTGRES_USER: saving_account
      POSTGRES_PASSWORD: saving_account_local
    ports:
      - "5432:5432"
    volumes:
      - saving-account-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saving_account -d saving_account"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saving-account-postgres:
